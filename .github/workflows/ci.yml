name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Sem requirements-ml.txt de propósito: os testes não carregam o modelo de embeddings.
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr testes
        run: pytest
